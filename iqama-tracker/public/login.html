<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول - متابعة الإقامات</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <form id="login" class="card login-card">
    <h1>متابعة الإقامات</h1>
    <label>اسم المستخدم<input name="username" autocomplete="username" required autofocus></label>
    <label>كلمة المرور<input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">دخول</button>
    <p id="error" class="error" hidden></p>
  </form>
  <script>
    document.getElementById('login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.fromEntries(new FormData(e.target))),
      });
      if (res.ok) return location.replace('/');
      const error = document.getElementById('error');
      error.textContent = (await res.json()).error;
      error.hidden = false;
    });
  </script>
</body>
</html>
